<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Produtos</title>
    
    <!-- Importação do CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 1. Importar a nova fonte do Google Fonts (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- 2. Aplicar a fonte à página toda usando CSS -->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-light">

    <!-- O 'container' centraliza o conteúdo e ajusta as margens -->
    <div class="container mt-5">
        
        <!-- Cabeçalho da página estilizado -->
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">Catálogo da Loja de Eletrônicos</h1>
            <p class="lead text-muted">Lista de produtos disponíveis</p>
        </div>

        <!-- Tabela dentro de um 'card' para dar um efeito de sombra e relevo -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <!-- Classes da tabela para linhas alternadas e efeito ao passar o rato -->
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Preço (R$)</th>
                            <th>Em Estoque</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- O seu ciclo Thymeleaf mantém-se exatamente igual -->
                        <tr th:each="produto : ${produtos}">
                            <td class="ps-4 fw-bold" th:text="${produto.id}">1</td>
                            <td th:text="${produto.nome}">Nome</td>
                            <td th:text="${produto.descricao}">Descrição</td>
                            <td th:text="${produto.preco}">0.0</td>
                            <td>
                                <!-- Transformamos o stock num pequeno distintivo (badge) -->
                                <span class="badge bg-success rounded-pill" th:text="${produto.quantidadeEstoque} + ' un'">0 un</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Mensagem de erro estilizada como um alerta amarelo -->
        <div th:if="${#lists.isEmpty(produtos)}" class="alert alert-warning mt-4 text-center shadow-sm" role="alert">
            <i class="bi bi-info-circle me-2"></i> Ainda não existem produtos registados no catálogo.
        </div>

    </div>

</body>
</html>
